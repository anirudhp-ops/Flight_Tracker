<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlightTracker — SFO</title>
  <meta name="description" content="3D flight tracker for San Francisco International Airport">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #020810;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    canvas { display: block; cursor: grab; outline: none; }
    canvas.dragging { cursor: grabbing !important; }

    /* ── HUD top-left ─────────────────────────────────────────── */
    #hud {
      position: fixed; top: 28px; left: 28px;
      z-index: 20; pointer-events: none; user-select: none;
    }
    #hud-title {
      font-size: 16px; font-weight: 600; letter-spacing: 0.04em;
      color: #c9d1d9; text-shadow: 0 0 28px rgba(55,138,221,0.55);
      margin-bottom: 10px; display: flex; align-items: center; gap: 7px;
    }
    #hud-title .pi { font-size: 18px; color: #378add; }
    #hud-badges { display: flex; gap: 7px; }
    .badge {
      font-size: 11px; font-weight: 500; padding: 3px 10px;
      border-radius: 20px; letter-spacing: 0.02em;
    }
    .bf { background:rgba(55,138,221,0.10); color:#79c0ff; border:1px solid rgba(55,138,221,0.22); }
    .bd { background:rgba(224,82,82,0.10);  color:#ff7b72; border:1px solid rgba(224,82,82,0.22);  }

    /* ── Legend bottom-left ───────────────────────────────────── */
    #legend {
      position: fixed; bottom: 30px; left: 28px;
      z-index: 20; pointer-events: none; user-select: none;
      display: flex; flex-direction: column; gap: 8px;
    }
    .lr { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:500; color:#6e7681; }
    .lp { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

    /* ── Tooltip ──────────────────────────────────────────────── */
    #tooltip {
      position: fixed; display: none; z-index: 100; pointer-events: none;
      background: rgba(8,13,22,0.96);
      border: 1px solid rgba(48,54,61,0.8);
      border-radius: 11px; padding: 14px 16px;
      min-width: 210px; max-width: 270px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* header row: IATA left, flight badge right */
    .tt-head {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px; margin-bottom: 3px;
    }
    #tt-iata {
      font-size: 24px; font-weight: 700; color: #e6edf3; line-height: 1;
    }
    #tt-flight {
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
      background: rgba(55,138,221,0.15); color: #79c0ff;
      border: 1px solid rgba(55,138,221,0.2);
      white-space: nowrap; align-self: center;
    }
    #tt-name {
      font-size: 11px; color: #6e7681; margin-bottom: 10px;
    }
    .tt-div {
      height: 1px; background: rgba(48,54,61,0.7); margin-bottom: 9px;
    }
    #tt-status { font-size: 11px; font-weight: 600; margin-bottom: 0; }
    .s-ok   { color: #4caf7a; }
    .s-late { color: #e05252; }

    /* affected flights block */
    #tt-affected { display: none; margin-top: 10px; }
    .tt-aff-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: #6e7681; margin-bottom: 6px;
    }
    .tt-aff-item {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; padding: 4px 0;
      border-bottom: 1px solid rgba(48,54,61,0.4);
    }
    .tt-aff-item:last-child { border-bottom: none; }
    .tt-aff-code { font-weight: 600; color: #e05252; }
    .tt-aff-route { color: #8b949e; font-size: 10px; }

    /* ── Loading hint ─────────────────────────────────────────── */
    #loading {
      position: fixed; bottom: 30px; right: 28px;
      font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; color: #2a3a4a;
      z-index: 20; pointer-events: none; transition: opacity 0.8s ease;
    }
  </style>
</head>
<body>

<canvas id="c" tabindex="0"></canvas>

<div id="hud">
  <div id="hud-title"><span class="pi">✈</span> FlightTracker — SFO</div>
  <div id="hud-badges">
    <span class="badge bf" id="badge-total">— flights</span>
    <span class="badge bd" id="badge-delayed">— delayed</span>
  </div>
</div>

<div id="legend">
  <div class="lr"><div class="lp" style="background:#4caf7a;box-shadow:0 0 7px #4caf7a88;"></div>On time</div>
  <div class="lr"><div class="lp" style="background:#e05252;box-shadow:0 0 7px #e0525288;"></div>Delayed</div>
</div>

<div id="tooltip">
  <div class="tt-head">
    <div id="tt-iata"></div>
    <div id="tt-flight"></div>
  </div>
  <div id="tt-name"></div>
  <div class="tt-div"></div>
  <div id="tt-status"></div>
  <div id="tt-affected">
    <div class="tt-aff-label" style="margin-top:10px;">Connecting flights at risk</div>
    <div id="tt-aff-list"></div>
  </div>
</div>

<div id="loading">Loading borders…</div>

  { iata:'SYD', name:'Sydney',            lat:-33.95,  lon: 151.18, delay:  0, airline:'QF', num:'74',   affected:[] },
  { iata:'AKL', name:'Auckland',          lat:-37.01,  lon: 174.79, delay:  0, airline:'NZ', num:'7',    affected:[] },
  // ── South America ─────────────────────────────────────────────
  { iata:'GRU', name:'São Paulo',         lat:-23.43,  lon: -46.47, delay:  0, airline:'UA', num:'856',  affected:[] },
  { iata:'BOG', name:'Bogotá',            lat:  4.70,  lon: -74.15, delay:  0, airline:'AV', num:'12',   affected:[] },
  { iata:'LIM', name:'Lima',              lat:-12.02,  lon: -77.11, delay:  0, airline:'LA', num:'2501', affected:[] },
  // ── Africa ────────────────────────────────────────────────────
  { iata:'JNB', name:'Johannesburg',      lat:-26.14,  lon:  28.25, delay: 40, airline:'SA', num:'287',
    affected:[{code:'SA203',route:'JNB → NBO'},{code:'SA285',route:'JNB → CPT'}] },
  { iata:'NBO', name:'Nairobi',           lat: -1.32,  lon:  36.93, delay:  0, airline:'KQ', num:'101',  affected:[] },
];

var delayedCount = ROUTES.filter(function(r){ return r.delay > 0; }).length;
document.getElementById('badge-total').textContent   = ROUTES.length + ' flights';
document.getElementById('badge-delayed').textContent = delayedCount + ' delayed';

// ═══════════════════════════════════════════════════════════════════
// RENDERER / SCENE / CAMERA
// ═══════════════════════════════════════════════════════════════════
var canvas   = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x020810, 1);

var scene  = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 2.6;

// ═══════════════════════════════════════════════════════════════════
// LIGHTS
// ═══════════════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x1a2840, 0.8));
var sun = new THREE.DirectionalLight(0x7ab4f5, 1.15);
sun.position.set(5, 3, 5);
scene.add(sun);
var rim = new THREE.DirectionalLight(0x0a1830, 0.45);
rim.position.set(-4, -2, -4);
scene.add(rim);

// ═══════════════════════════════════════════════════════════════════
// GLOBE GROUP
// ═══════════════════════════════════════════════════════════════════
var globeGroup = new THREE.Group();
scene.add(globeGroup);

// Earth sphere — slightly warmer so land feels different from ocean
var earth = new THREE.Mesh(
  new THREE.SphereGeometry(1, 72, 72),
  new THREE.MeshPhongMaterial({ color: 0x0d1a2e, specular: 0x1a3a5c, shininess: 18 })
);
globeGroup.add(earth);

// Atmospheric rim glow (back-face, not in globeGroup so it stays camera-aligned)
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.10, 64, 64),
  new THREE.MeshPhongMaterial({ color: 0x1a50aa, side: THREE.BackSide, transparent: true, opacity: 0.28 })
));

// ═══════════════════════════════════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════════════════════════════════
function ll2v(lat, lon, r) {
  r = (r === undefined) ? 1 : r;
  var phi   = (90 - lat) * Math.PI / 180;
  var theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// ═══════════════════════════════════════════════════════════════════
// GRID LINES (lat/lon every 20° — very subtle)
// ═══════════════════════════════════════════════════════════════════
var gridMat = new THREE.LineBasicMaterial({ color: 0x12283a, transparent: true, opacity: 0.35 });
for (var glat = -80; glat <= 80; glat += 20) {
  var gpts = [];
  for (var glon = -180; glon <= 181; glon += 3) gpts.push(ll2v(glat, glon, 1.002));
  globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(gpts), gridMat));
}
for (var glon2 = -180; glon2 < 180; glon2 += 20) {
  var gpts2 = [];
  for (var glat2 = -90; glat2 <= 90; glat2 += 3) gpts2.push(ll2v(glat2, glon2, 1.002));
  globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(gpts2), gridMat));
}

// ═══════════════════════════════════════════════════════════════════
// COUNTRY BORDERS — split into coast + interior for visual depth
// Interior (shared between two countries): bright teal  #3a9ec2  0.90
// Exterior (coastlines / outer boundary):  medium blue  #1e6480  0.70
// ═══════════════════════════════════════════════════════════════════
function buildSegments(meshObj) {
  var pts = [];
  meshObj.coordinates.forEach(function(line) {
    for (var i = 0; i < line.length - 1; i++) {
      var lo1 = line[i][0],   la1 = line[i][1];
      var lo2 = line[i+1][0], la2 = line[i+1][1];
      if (Math.abs(lo2 - lo1) > 120) continue;   // skip antimeridian jumps
      pts.push(ll2v(la1, lo1, 1.001));
      pts.push(ll2v(la2, lo2, 1.001));
    }
  });
  return new THREE.BufferGeometry().setFromPoints(pts);
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(function(r) { return r.json(); })
  .then(function(world) {
    // Interior borders (shared between countries) — brighter, more visible
    var interior = topojson.mesh(world, world.objects.countries, function(a, b) { return a !== b; });
    globeGroup.add(new THREE.LineSegments(
      buildSegments(interior),
      new THREE.LineBasicMaterial({ color: 0x3a9ec2, transparent: true, opacity: 0.90 })
    ));

    // Exterior borders (coastlines / outer edge) — slightly dimmer, bluish
    var exterior = topojson.mesh(world, world.objects.countries, function(a, b) { return a === b; });
    globeGroup.add(new THREE.LineSegments(
      buildSegments(exterior),
      new THREE.LineBasicMaterial({ color: 0x1e6480, transparent: true, opacity: 0.70 })
    ));

    var el = document.getElementById('loading');
    el.style.opacity = '0';
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
  })
  .catch(function() {
    var el = document.getElementById('loading');
    if (el) el.textContent = '';
  });

// ═══════════════════════════════════════════════════════════════════
// SFO ORIGIN MARKER
// ═══════════════════════════════════════════════════════════════════
var sfoPt  = ll2v(SFO.lat, SFO.lon, 1.013);
var sfoDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.024, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x378add })
);
sfoDot.position.copy(sfoPt);
globeGroup.add(sfoDot);

var sfoHalo = new THREE.Mesh(
  new THREE.SphereGeometry(0.040, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x378add, transparent: true, opacity: 0.18 })
);
sfoHalo.position.copy(sfoPt);
globeGroup.add(sfoHalo);

// ═══════════════════════════════════════════════════════════════════
// ARCS · AIRCRAFT · DESTINATION DOTS
//
// Key design decisions that fix the click issue:
//   • Destination dots are ONLY added to destMeshes (raycast targets).
//     Aircraft are NOT in destMeshes, so they never block clicks.
//   • Dots are radius 0.028 (was 0.012) — much larger hit area.
//   • Aircraft are radius 0.006 (smaller than dots) and visually dimmer.
// ═══════════════════════════════════════════════════════════════════
var arcAnims   = [];   // { curve, mat, aircraft, t, speed }
var destMeshes = [];   // ONLY static destination dots — for raycasting

var sfoVec = ll2v(SFO.lat, SFO.lon, 1.0);

ROUTES.forEach(function(route, i) {
  var delayed = route.delay > 0;
  var col = delayed ? 0xe05252 : 0x4caf7a;

  var dstVec = ll2v(route.lat, route.lon, 1.0);
  var angle  = sfoVec.angleTo(dstVec);
  var lift   = 0.15 + (angle / Math.PI) * 0.25;
  var ctrl   = sfoVec.clone().add(dstVec).normalize().multiplyScalar(1.0 + lift * 2.0);
  var curve  = new THREE.QuadraticBezierCurve3(sfoVec.clone(), ctrl, dstVec.clone());

  // Arc line
  var arcMat = new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.75 });
  globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(80)), arcMat));

  // Aircraft — small, dimmed, NOT in destMeshes
  var aircraft = new THREE.Mesh(
    new THREE.SphereGeometry(0.006, 8, 8),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.75 })
  );
  var t0 = i / ROUTES.length;
  aircraft.position.copy(curve.getPoint(t0));
  globeGroup.add(aircraft);

  arcAnims.push({ curve: curve, mat: arcMat, aircraft: aircraft, t: t0,
                  speed: 0.00065 + Math.random() * 0.00055 });

  // ── STATIC destination dot — larger, clearly distinct from aircraft ──
  var destPos = ll2v(route.lat, route.lon, 1.013);

  // Outer glow ring (slightly larger, transparent) — purely visual
  var glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.040, 12, 12),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.18 })
  );
  glow.position.copy(destPos);
  globeGroup.add(glow);

  // Core dot — this is what the raycaster hits
  var dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.028, 14, 14),
    new THREE.MeshBasicMaterial({ color: col })
  );
  dot.position.copy(destPos);
  dot.userData = route;
  globeGroup.add(dot);
  destMeshes.push(dot);   // ← only static dots here
});

// ═══════════════════════════════════════════════════════════════════
// DRAG-TO-ROTATE WITH MOMENTUM
// ═══════════════════════════════════════════════════════════════════
var MAX_TILT  = 70 * Math.PI / 180;
var isDrag    = false;
var autoSpin  = true;
var lastRelease = 0;
var vel       = { x: 0, y: 0 };
var prevPt    = { x: 0, y: 0 };
var mouse2d   = new THREE.Vector2();

function clampTilt() {
  globeGroup.rotation.x = Math.max(-MAX_TILT, Math.min(MAX_TILT, globeGroup.rotation.x));
}

function ptrDown(cx, cy) {
  isDrag = true; autoSpin = false; vel = { x:0, y:0 };
  prevPt = { x: cx, y: cy };
  canvas.classList.add('dragging');
}

function ptrMove(cx, cy) {
  var rect = canvas.getBoundingClientRect();
  mouse2d.x =  ((cx - rect.left) / rect.width)  * 2 - 1;
  mouse2d.y = -((cy - rect.top)  / rect.height) * 2 + 1;
  doHover(cx, cy);

  if (!isDrag) return;
  var dx = cx - prevPt.x, dy = cy - prevPt.y;
  vel.y = dx * 0.005; vel.x = dy * 0.005;
  globeGroup.rotation.y += dx * 0.005;
  globeGroup.rotation.x += dy * 0.005;
  clampTilt();
  prevPt = { x: cx, y: cy };
}

function ptrUp() {
  isDrag = false; lastRelease = Date.now();
  canvas.classList.remove('dragging');
}

canvas.addEventListener('mousedown',  function(e) { ptrDown(e.clientX, e.clientY); });
window.addEventListener('mousemove',  function(e) { ptrMove(e.clientX, e.clientY); });
window.addEventListener('mouseup',    function()  { ptrUp(); });
canvas.addEventListener('mouseleave', function()  { hideTooltip(); });

canvas.addEventListener('touchstart', function(e) { e.preventDefault(); ptrDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive:false });
canvas.addEventListener('touchmove',  function(e) { e.preventDefault(); ptrMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive:false });
canvas.addEventListener('touchend',   function(e) { e.preventDefault(); ptrUp(); }, { passive:false });

// ═══════════════════════════════════════════════════════════════════
// TOOLTIP / RAYCASTING
// ═══════════════════════════════════════════════════════════════════
var raycaster  = new THREE.Raycaster();
var tooltip    = document.getElementById('tooltip');
var ttIata     = document.getElementById('tt-iata');
var ttFlight   = document.getElementById('tt-flight');
var ttName     = document.getElementById('tt-name');
var ttStatus   = document.getElementById('tt-status');
var ttAffected = document.getElementById('tt-affected');
var ttAffList  = document.getElementById('tt-aff-list');

function showTooltip(route, px, py) {
  ttIata.textContent   = route.iata;
  ttFlight.textContent = route.airline + '\u00a0' + route.num;   // "UA 1145"
  ttName.textContent   = route.name;

  if (route.delay > 0) {
    ttStatus.innerHTML = '<span class="s-late">⚠ Delayed +' + route.delay + ' min</span>';
    if (route.affected && route.affected.length > 0) {
      ttAffList.innerHTML = route.affected.map(function(a) {
        return '<div class="tt-aff-item">' +
               '<span class="tt-aff-code">' + a.code + '</span>' +
               '<span class="tt-aff-route">' + a.route + '</span>' +
               '</div>';
      }).join('');
      ttAffected.style.display = 'block';
    } else {
      ttAffected.style.display = 'none';
    }
  } else {
    ttStatus.innerHTML = '<span class="s-ok">✓ On time</span>';
    ttAffected.style.display = 'none';
  }

  tooltip.style.display = 'block';
  var tw = tooltip.offsetWidth  || 210;
  var th = tooltip.offsetHeight || 100;
  var tx = Math.min(px + 16, window.innerWidth  - tw - 10);
  var ty = Math.max(Math.min(py - 10, window.innerHeight - th - 10), 10);
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
}

function hideTooltip() { tooltip.style.display = 'none'; }

function doHover(px, py) {
  raycaster.setFromCamera(mouse2d, camera);
  var hits = raycaster.intersectObjects(destMeshes, false);
  if (hits.length > 0) {
    canvas.style.cursor = 'pointer';
    showTooltip(hits[0].object.userData, px, py);
  } else if (!isDrag) {
    canvas.style.cursor = '';
    hideTooltip();
  }
}

// ═══════════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════
var tick = 0;

function animate() {
  requestAnimationFrame(animate);
  tick++;

  if (!isDrag) {
    if (Date.now() - lastRelease > 1500) autoSpin = true;
    if (autoSpin) {
      globeGroup.rotation.y += 0.0012;
    } else {
      vel.x *= 0.91; vel.y *= 0.91;
      globeGroup.rotation.y += vel.y;
      globeGroup.rotation.x += vel.x;
      clampTilt();
    }
  }

  // Arc opacity pulse + aircraft movement
  var base = tick * 0.038;
  arcAnims.forEach(function(obj, i) {
    obj.mat.opacity = 0.28 + 0.52 * (0.5 + 0.5 * Math.sin(base + i * 0.27));
    obj.t = (obj.t + obj.speed) % 1.0;
    obj.aircraft.position.copy(obj.curve.getPoint(obj.t));
  });

  // SFO halo pulse
  var hs = 1 + 0.20 * Math.sin(tick * 0.065);
  sfoHalo.scale.setScalar(hs);

  renderer.render(scene, camera);
}

animate();

// ═══════════════════════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════════════════════
window.addEventListener('resize', function() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body>
