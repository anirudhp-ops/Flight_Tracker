# Deviation from the literal spec, stated up front: no Zookeeper service.
# Kafka 4.x (what's actually used here — see KAFKA_ARCHITECTURE.md) removed
# Zookeeper mode entirely; brokers run in KRaft (self-managed metadata quorum)
# instead. A docker-compose.yml with a zookeeper service would either be
# ignored by a KRaft broker or fail outright, so shipping one "because the
# spec said so" would be worse than deviating and saying why.
#
# Postgres and Redis are included per the phase brief ("add to compose for
# future"), on non-default host ports (5433, 6380) so they don't collide
# with the native installs this project actually runs against today (see
# README.md — createdb/createuser flow, `redis-server`). Don't run both at
# once against the same app instance; config.py only ever points at one.
#
# prometheus/grafana (Phase J) scrape and visualize the backend's own
# GET /metrics — see prometheus.yml's own header for why there's no `kafka`
# scrape job, and flight_tracker/OBSERVABILITY.md for how to read the
# dashboard. Neither depends on postgres/redis/kafka above; they only talk
# to the host-run backend (prometheus.yml targets host.docker.internal:8000).
#
# Usage:
#   docker compose up -d
#   scripts/create_kafka_topics.sh   # idempotent, safe to re-run
#   uvicorn flight_tracker.server:app   # backend runs on the host, not here
#   open http://localhost:3001          # Grafana (admin/admin on first login)
#   docker compose down              # add -v to also drop the Kafka log volume

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: flight-tracker-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: flight-tracker-postgres
    ports:
      - "5433:5432"  # non-default: avoid clashing with the native Postgres this app runs against today
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flight_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flight-tracker-redis
    ports:
      - "6380:6379"  # non-default: avoid clashing with the native Redis this app runs against today
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: flight-tracker-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    # Lets the container resolve host.docker.internal on Linux too (Docker
    # Desktop on Mac/Windows already provides this out of the box) — needed
    # for prometheus.yml's flight-backend scrape target to reach the
    # host-run uvicorn process.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: flight-tracker-grafana
    ports:
      # Non-default host port: 3000 is already this project's React dev
      # server (see README.md's `npm start`).
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./flight_tracker/observability/grafana_dashboard.json:/var/lib/grafana/dashboards/grafana_dashboard.json:ro
    depends_on:
      - prometheus

volumes:
  kafka_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
