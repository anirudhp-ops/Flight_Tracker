# Deviation from the literal spec, stated up front: no Zookeeper service.
# Kafka 4.x (what's actually used here — see KAFKA_ARCHITECTURE.md) removed
# Zookeeper mode entirely; brokers run in KRaft (self-managed metadata quorum)
# instead. A docker-compose.yml with a zookeeper service would either be
# ignored by a KRaft broker or fail outright, so shipping one "because the
# spec said so" would be worse than deviating and saying why.
#
# Postgres and Redis are on non-default host ports (5433, 6380) so they
# don't collide with the native installs this project can also run against
# (see README.md — createdb/createuser flow, `redis-server`); config.py only
# ever points at one at a time. The backend/frontend services below always
# talk to postgres/redis/kafka via their in-network service name and
# *container* port (5432/6379/29092), never the host-remapped ports above —
# those remaps only matter for host tools connecting in from outside compose.
#
# Kafka has two listeners for exactly that host-vs-container split:
# PLAINTEXT_HOST (localhost:9092) is what a host-run backend
# (`uvicorn flight_tracker.server:app`, per README.md) and host tools use;
# PLAINTEXT (kafka:29092, not published to the host) is what the
# containerized `backend` service below uses. This was flagged as a TODO in
# .env.example's KAFKA_BROKER_ADDRESS comment before the backend service
# existed — this is that follow-through.
#
# prometheus/grafana (Phase J) scrape and visualize the backend's own
# GET /metrics — see prometheus.yml's own header for why there's no `kafka`
# scrape job, and flight_tracker/OBSERVABILITY.md for how to read the
# dashboard. prometheus.yml targets host.docker.internal:8000, which still
# reaches the backend whether it's running on the host or as the `backend`
# service below (its 8000 is published to the host either way).
#
# Usage (containerized backend/frontend — needs ml/model.pkl on the host
# first; `python ml/train.py` if you don't have one):
#   docker compose up -d
#   scripts/create_kafka_topics.sh   # idempotent, safe to re-run
#   open http://localhost:3000          # frontend (nginx, prod build)
#   open http://localhost:3001          # Grafana (admin/admin on first login)
#   docker compose down              # add -v to also drop the Kafka log volume
#
# Usage (host-run backend/frontend, unchanged from before this phase):
#   docker compose up -d postgres redis kafka prometheus grafana
#   uvicorn flight_tracker.server:app --reload
#   cd frontend && npm start

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: flight-tracker-kafka
    ports:
      - "9092:9092"   # PLAINTEXT_HOST only — 29092 (PLAINTEXT) is container-network-internal
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: flight-tracker-postgres
    ports:
      - "5433:5432"  # non-default: avoid clashing with the native Postgres this app runs against today
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flight_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flight-tracker-redis
    ports:
      - "6380:6379"  # non-default: avoid clashing with the native Redis this app runs against today
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: flight-tracker-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    # Lets the container resolve host.docker.internal on Linux too (Docker
    # Desktop on Mac/Windows already provides this out of the box) — needed
    # for prometheus.yml's flight-backend scrape target to reach the
    # host-run uvicorn process.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: flight-tracker-grafana
    ports:
      # Non-default host port: 3000 is already this project's React dev
      # server (see README.md's `npm start`).
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./flight_tracker/observability/grafana_dashboard.json:/var/lib/grafana/dashboards/grafana_dashboard.json:ro
    depends_on:
      - prometheus

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-tracker-backend
    ports:
      - "8000:8000"
    # Self-contained: doesn't read .env (that file describes the host-run
    # setup, where DB/Redis/Kafka are all "localhost"). In-network service
    # names and container ports instead — see the file header comment.
    environment:
      ENABLE_FLIGHTAWARE_API: "false"
      TARGET_AIRPORT: KJFK
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: flight_tracker
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      # Not baked into the image (see Dockerfile) — must exist on the host
      # first: `python ml/train.py`.
      - ./ml/model.pkl:/app/ml/model.pkl:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Empty -> the app's own fallback of "http://localhost:8000" (see
      # frontend/Dockerfile's comment) — correct here since backend's 8000
      # is published to the host above and the browser runs on the host.
      args:
        REACT_APP_BACKEND_URL: ""
    container_name: flight-tracker-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  kafka_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
